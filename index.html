<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Packing Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-container">
        <div id="left-panel">
            <div id="item-inputs">
                <!-- Item inputs will go here -->
            </div>
            <div id="container-controls">
                <!-- Container controls will go here -->
            </div>
        </div>
        <div id="right-panel">
            <div id="visualization-container">
                <!-- 3D visualization will go here -->
            </div>
        </div>
        <div id="bottom-panel">
            <div id="stats-display">
                <!-- Stats will go here -->
            </div>
            <div id="logs-display">
                <!-- Logs will go here -->
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
